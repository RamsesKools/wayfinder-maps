version: 2

project_name: wayfinder-maps

# Three build flavours, one binary name. macOS binds WKWebView through cgo
# (cross-compiled with osxcross in the goreleaser-cross image);
# Windows gets its native window via pure-Go WebView2 bindings; Linux stays
# pure Go here and carries its webkit linkage in the helper binary, which CI
# builds on Linux runners and drops into helpers/ before this config runs.
# Every binary takes its --version from the tag, same as the Linux helper in release.yml.
builds:
  - id: darwin
    main: ./cmd/wayfinder-maps
    binary: wayfinder-maps
    env:
      - CGO_ENABLED=1
      - CC={{ if eq .Arch "arm64" }}oa64-clang{{ else }}o64-clang{{ end }}
      - CXX={{ if eq .Arch "arm64" }}oa64-clang++{{ else }}o64-clang++{{ end }}
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/RamsesKools/wayfinder-maps/internal/version.Version={{ .Version }}
  - id: windows
    main: ./cmd/wayfinder-maps
    binary: wayfinder-maps
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/RamsesKools/wayfinder-maps/internal/version.Version={{ .Version }}
  - id: linux
    main: ./cmd/wayfinder-maps
    binary: wayfinder-maps
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/RamsesKools/wayfinder-maps/internal/version.Version={{ .Version }}

archives:
  # darwin and linux ship double-clickable launchers for the app window and
  # the browser view; macOS gets them as .command so Finder executes them.
  # Windows needs neither a shell script nor a helper, so its archive is bare.
  - id: darwin
    ids: [darwin]
    name_template: "wayfinder-maps_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: scripts/wayfinder-app
        dst: wayfinder-app.command
        info:
          mode: 0755
      - src: scripts/wayfinder-web
        dst: wayfinder-web.command
        info:
          mode: 0755
  - id: windows
    ids: [windows]
    name_template: "wayfinder-maps_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
  # Linux archives ship the webkit helper next to the main binary; `app` and
  # the folder picker exec it from there.
  - id: linux
    ids: [linux]
    name_template: "wayfinder-maps_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: "helpers/linux_{{ .Arch }}/wayfinder-maps-webview"
        strip_parent: true
      - src: scripts/wayfinder-app
        dst: wayfinder-app
        info:
          mode: 0755
      - src: scripts/wayfinder-web
        dst: wayfinder-web
        info:
          mode: 0755

checksum:
  name_template: checksums.txt

changelog:
  use: github

# The tap's cask is committed through the GitHub API with an app token (minted in
# release.yml), so the commits show up as the app and Verified. macOS only: the
# archives are unsigned, so postflight strips the quarantine flag like install.sh.
homebrew_casks:
  - name: wayfinder-maps
    ids: [darwin]
    binaries: [wayfinder-maps]
    homepage: https://github.com/RamsesKools/wayfinder-maps
    description: CLI and star-map viewer for wayfinder maps
    license: MIT
    repository:
      owner: RamsesKools
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: wayfinder-maps-release[bot]
      email: wayfinder-maps-release[bot]@users.noreply.github.com
      use_github_app_token: true
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/wayfinder-maps"]
          end
