# Release binaries on every push to main (tag derived from plugin.json), from a
# manual run on main, or from a pushed/selected vX.Y.Z tag whose commit is on main. The Linux webkit helper must be built on Linux
# (cgo against webkit2gtk), so two runner jobs build it per-arch first; the
# GoReleaser job (Linux, goreleaser-cross) then builds everything else, darwin
# with cgo via osxcross for the native window, windows and linux mains as pure Go — and packs the
# helpers into the Linux archives.
#
# ubuntu-22.04 on purpose: binaries link the oldest glibc we can, and jammy's
# libwebkit2gtk-4.1 matches what current distros ship at runtime.
#
# The same goreleaser run commits the Homebrew cask to RamsesKools/homebrew-tap with a
# short-lived GitHub App token (minted just before the Release step, revoked at job end).
#
# Once the release is out, the docs job deploys the site from the same tag to GitHub Pages.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve and tag version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tagged commit that is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Releases only come from main."
            exit 1
          fi

      - name: Resolve tag
        id: resolve
        run: |
          # plugin.json is the only version source; a tag must agree with it
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="v$VERSION"
          else
            echo "Releases can only be cut from main or from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a valid version tag: $TAG"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match plugin.json version $VERSION."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Tag the commit
        if: github.ref_type == 'branch'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.TAG}` });
              if (data.object.sha !== context.sha) {
                core.setFailed(`Tag ${process.env.TAG} already exists on ${data.object.sha}. Bump the version in plugin.json.`);
              } else {
                console.log(`Tag ${process.env.TAG} already on this commit, continuing.`);
              }
              return;
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${process.env.TAG}`, sha: context.sha });

  linux-helper:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install webkit2gtk dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build helper
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X github.com/RamsesKools/wayfinder-maps/internal/version.Version=${TAG#v}" -o wayfinder-maps-webview ./cmd/wayfinder-maps-webview
      - uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.arch }}
          path: wayfinder-maps-webview

  goreleaser:
    needs: [prepare, linux-helper]
    runs-on: ubuntu-latest
    # osxcross + macOS SDK let this Linux job build the darwin cgo targets.
    container: ghcr.io/goreleaser/goreleaser-cross:v1.27.3-4
    # Holds the tap app's credentials; only main and v* tags may deploy to it.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: helpers
      - name: Restore helper exec bits # artifacts drop file modes
        run: chmod +x helpers/*/wayfinder-maps-webview
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - name: Release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}

  docs:
    needs: [prepare, goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The build also exports the demo map into site/demo/ (docs_hooks.py), which needs Go.
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v5
