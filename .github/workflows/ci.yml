# Push/PR guard. release.yml only fires on releases, so nothing here caught a
# broken build — or, since the web/ refactor, a syntax error in an embedded JS
# module, which no longer fails `go build` and would surface only at runtime in
# the browser. This keeps it minimal: Go health plus an ESM syntax pass.
#
# CGO_ENABLED=0 on purpose: the real webview helper needs webkit2gtk headers
# (release.yml installs them), but the pure-Go build tags compile without cgo,
# which is all we need to vet/test the code and keep this runner dependency-free.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CGO_ENABLED: "0"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # node --check on a .js file parses it as CommonJS and silently accepts
      # broken `import`/`export`; feeding it over stdin with --input-type=module
      # is what actually validates the modules as ESM.
      - name: Syntax-check frontend modules
        run: |
          status=0
          for f in cmd/wayfinder-maps/web/js/*.js; do
            if node --check --input-type=module < "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status
      # A bare directory isn't a valid --test target on Node 22 (it's loaded
      # as a module and fails); glob the test files explicitly.
      - name: Run frontend unit tests
        run: node --test cmd/wayfinder-maps/webtests/*.test.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run mkdocs build --strict

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh scripts/tests/install_test.sh
      - run: bash scripts/tests/install_test.sh

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a higher plugin.json version than the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          BASE=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r .version)
          HEAD=$(jq -r .version .claude-plugin/plugin.json)
          echo "base $BASE, this PR $HEAD"
          if [ "$BASE" = "$HEAD" ] || [ "$(printf '%s\n%s\n' "$BASE" "$HEAD" | sort -V | tail -1)" != "$HEAD" ]; then
            echo "Bump the version in .claude-plugin/plugin.json above $BASE."
            exit 1
          fi
