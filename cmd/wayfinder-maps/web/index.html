<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wayfinder-maps</title>
<!-- favicon-red.svg and favicon-green.svg are spare variants: blue is the default, the others could later signal status (e.g. error or all-resolved) -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="topbar"><img id="brand" src="favicon.svg" alt="" width="28" height="28"><button id="backbtn">&larr; Maps</button><button id="pullbtn" hidden>&#8635; Refresh from GitHub</button><span id="pullacct" hidden></span><span id="pullstat" hidden><i class="spin"></i><span class="txt"></span></span><span id="projtag"></span><span id="hint">drag to pan &middot; scroll to zoom &middot; click a star</span><span id="settings"><button id="setbtn" type="button" aria-label="Viewer settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13.5a7.5 7.5 0 0 0 0-3l2-1.5-2-3.5-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.4a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.5 2 1.5a7.5 7.5 0 0 0 0 3l-2 1.5 2 3.5 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.5 2.4h4l.5-2.4a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.5z"/></svg></button><div id="setpop" hidden><div class="setrow"><label class="setname" for="freezenodes">Freeze nodes</label><button class="help" type="button" aria-label="About Freeze nodes" aria-describedby="freezehelp"><svg viewBox="4 4 16 16" aria-hidden="true"><g transform="translate(0 .5)"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-2.9 2.6-2.9 3.9"/><path d="M12 17h.01"/></g></svg></button><span class="tip" id="freezehelp" role="tooltip">Stops the stars drifting. The layout, edge particles and other effects keep moving.</span><label class="swl"><input id="freezenodes" type="checkbox" role="switch"><i class="sw"></i></label></div></span></div>
<div id="compass" role="group" aria-label="Map flow direction"></div>
<div id="hud"></div>
<div id="panel"><span class="x">&times;</span><h2></h2><div class="meta"></div><div class="md"></div></div>

<div id="splash">
  <div class="splashcard">
    <div class="logo"><img src="favicon.svg" alt="">wayfinder</div>
    <button id="openfolder">Open Folder&hellip;</button>
    <div id="gh">
      <div class="recent-h">GitHub</div>
      <div id="ghstatus"></div>
      <div id="ghrepobox"><input id="ghrepo" role="combobox" aria-controls="ghrepolist" aria-expanded="false" placeholder="owner/repo or GitHub URL" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="GitHub repository"><button id="ghrepobtn" type="button" tabindex="-1" aria-label="Show recent repositories" aria-expanded="false"></button><div id="ghrepolist" class="ghlist" role="listbox" hidden></div></div>
      <div id="ghmap"><button id="ghmapbtn" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>Choose a map&hellip;</button><div id="ghmaplist" class="ghlist" role="listbox" hidden></div></div>
      <div class="ghrow"><button id="ghopen" disabled>Open from GitHub</button><span id="ghstat" hidden><i class="spin"></i><span class="txt"></span></span></div>
    </div>
    <div class="recent-h">Recent</div>
    <div id="recents"></div>
  </div>
</div>

<div id="maplist">
  <div class="listtop">
    <div id="projname"></div>
    <button id="openanother">&#8644; Switch projects</button>
  </div>
  <div id="cards"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
