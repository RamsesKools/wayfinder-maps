<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wayfinder-maps</title>
<!-- favicon-red.svg and favicon-green.svg are spare variants: blue is the default, the others could later signal status (e.g. error or all-resolved) -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="topbar"><button id="backbtn">&larr; Maps</button><button id="pullbtn" hidden>&#8635; Pull from GitHub</button><span id="pullacct" hidden></span><span id="pullstat" hidden><i class="spin"></i><span class="txt"></span></span><span id="projtag"></span><span id="hint">drag to pan &middot; scroll to zoom &middot; click a star</span></div>
<div id="compass" role="group" aria-label="Map flow direction"></div>
<div id="hud"></div>
<div id="panel"><span class="x">&times;</span><h2></h2><div class="meta"></div><div class="md"></div></div>

<div id="splash">
  <div class="splashcard">
    <div class="logo"><img src="favicon.svg" alt="">wayfinder</div>
    <button id="openfolder">Open Folder&hellip;</button>
    <div class="recent-h">Recent</div>
    <div id="recents"></div>
  </div>
</div>

<div id="maplist">
  <div class="listtop">
    <div id="projname"></div>
    <button id="openanother">&#8644; Switch projects</button>
  </div>
  <div id="cards"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
